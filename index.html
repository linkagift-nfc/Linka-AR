<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Linka AR</title>

    <meta
        name="description"
        content="Experiência em realidade aumentada com modelos 3D.">

    <meta
        name="theme-color"
        content="#0b1020">

    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    #1b2a52 0%,
                    #0b1020 45%,
                    #05070d 100%
                );
            color: #ffffff;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .titulo {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .descricao {
            font-size: 15px;
            line-height: 1.5;
            opacity: 0.85;
            margin-bottom: 20px;
        }

        .viewer-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 24px;
            overflow: hidden;
            background:
                radial-gradient(
                    circle,
                    rgba(255, 255, 255, 0.08),
                    rgba(255, 255, 255, 0.01)
                );
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);
            margin-bottom: 20px;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .ar-button {
            background: #ffffff;
            color: #111827;
            border: none;
            border-radius: 999px;
            padding: 15px 24px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.25);
        }

        .ar-button:active {
            transform: scale(0.98);
        }

        .status {
            margin-top: 15px;
            font-size: 13px;
            line-height: 1.5;
            opacity: 0.75;
        }

        .erro {
            color: #ffb4b4;
        }

        .rodape {
            margin-top: 24px;
            font-size: 12px;
            opacity: 0.45;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">
            LINKA AR
        </div>

        <h1
            class="titulo"
            id="titulo">

            Carregando experiência...

        </h1>

        <p
            class="descricao"
            id="descricao">

            Aguarde enquanto o modelo 3D é carregado.

        </p>

        <div class="viewer-box">

            <model-viewer
                id="viewer"

                alt="Modelo 3D"

                camera-controls
                auto-rotate
                rotation-per-second="15deg"

                shadow-intensity="1"

                environment-image="neutral"

                exposure="1"

                ar
                ar-modes="webxr scene-viewer quick-look"

                ar-scale="auto"

                autoplay>

                <button
                    slot="ar-button"
                    class="ar-button">

                    VER EM REALIDADE AUMENTADA

                </button>

            </model-viewer>

        </div>

        <div
            class="status"
            id="status">

            Preparando modelo...

        </div>

        <div class="rodape">
            Experiência Linka AR
        </div>

    </main>

    <script>
        const params =
            new URLSearchParams(
                window.location.search
            );

        const id =
            params.get("id");

        const viewer =
            document.getElementById(
                "viewer"
            );

        const titulo =
            document.getElementById(
                "titulo"
            );

        const descricao =
            document.getElementById(
                "descricao"
            );

        const status =
            document.getElementById(
                "status"
            );


        // ============================================
        // SEM ID
        // ============================================

        if (!id) {

            titulo.textContent =
                "Modelo não informado";

            descricao.textContent =
                "Este link precisa indicar qual experiência AR deve ser carregada.";

            status.innerHTML =
                '<span class="erro">' +
                'Use um endereço como ?id=terra' +
                '</span>';

        }

        else {

            // ============================================
            // SEGURANÇA DO NOME
            // ============================================

            const idSeguro =
                id
                    .toLowerCase()
                    .replace(
                        /[^a-z0-9-_]/g,
                        ""
                    );


            // ============================================
            // CAMINHO AUTOMÁTICO
            // ============================================

            const caminhoModelo =
                `models/${idSeguro}/modelo.glb`;


            // ============================================
            // CARREGAR MODELO
            // ============================================

            viewer.src =
                caminhoModelo;

            titulo.textContent =
                idSeguro
                    .replace(/-/g, " ")
                    .replace(
                        /\b\w/g,
                        letra =>
                            letra.toUpperCase()
                    );

            descricao.textContent =
                "Gire o modelo com o dedo ou visualize em realidade aumentada.";

            status.textContent =
                "Carregando modelo 3D...";


            // ============================================
            // MODELO CARREGADO
            // ============================================

            viewer.addEventListener(
                "load",
                () => {

                    status.textContent =
                        "Modelo carregado.";

                    // Se houver animação no GLB,
                    // tenta reproduzir automaticamente.

                    if (
                        viewer.availableAnimations &&
                        viewer.availableAnimations.length > 0
                    ) {

                        viewer.animationName =
                            viewer.availableAnimations[0];

                        viewer.play();

                    }

                }
            );


            // ============================================
            // ERRO
            // ============================================

            viewer.addEventListener(
                "error",
                () => {

                    titulo.textContent =
                        "Modelo não encontrado";

                    descricao.textContent =
                        "Não foi possível carregar esta experiência.";

                    status.innerHTML =
                        '<span class="erro">' +
                        'Verifique se existe a pasta "' +
                        idSeguro +
                        '" e o arquivo "modelo.glb".' +
                        '</span>';

                }
            );

        }
    </script>

</body>

</html>
